name: Build Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Prepare Web Directory & Sync Capacitor
        run: |
          mkdir -p www
          if [ -f "flight.html" ]; then
            cp flight.html www/index.html
          fi
          if [ -f "index.html" ]; then
            cp index.html www/index.html
          fi
          if [ ! -f "www/index.html" ]; then
            echo "<html><body><h1>Flight Tracker</h1></body></html>" > www/index.html
          fi
          npm install
          npx cap add android || true
          npx cap sync android

      - name: Accept Android Licenses & Build APK
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK File
        uses: actions/upload-artifact@v4
        with:
          name: FlightTracker-App
          path: android/app/build/outputs/apk/debug/app-debug.apk
